- obs space:
    <<: *ObsSpace
    name: atms_npp
    obsdatain:
      engine:
        type: H5File
        obsfile: {{InDBDir}}/atms_npp_obs_{{thisValidDate}}.h5
    obsdataout:
      engine:
        type: H5File
        obsfile: {{OutDBDir}}/{{obsPrefix}}_atms_npp.h5
    simulated variables: [brightnessTemperature]
    channels: &atms_npp_channels 1-7,16,17,18-22
  obs error: *ObsErrorDiagonal
  obs operator:
    <<: *cloudyCRTMObsOperator
    obs options:
      <<: *CRTMObsOptions
      Sensor_ID: atms_npp
  get values:
    <<: *GetValues

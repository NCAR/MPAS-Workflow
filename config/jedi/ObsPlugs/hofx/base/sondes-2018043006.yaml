- obs space:
    <<: *ObsSpace
    name: Radiosonde
    obsdatain:
      engine:
        type: H5File
        obsfile: {{InDBDir}}/sondes_obs_{{thisValidDate}}.h5
    obsdataout:
      write multiple files: true
      engine:
        type: H5File
        obsfile: {{OutDBDir}}/{{obsPrefix}}_sondes.h5
    simulated variables: [airTemperature, virtualTemperature, windEastward, windNorthward]
  obs error: *ObsErrorDiagonal
  obs operator:
    name: VertInterp
    observation alias file: obsop_name_map.yaml

  obs filters:
  - filter: Domain Check
    filter variables:
    - name: brightnessTemperature
      channels: 1-5,16,17 
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      minvalue: 1.0
#  - filter: Domain Check
#    where:
#    - variable:
#        name: MetaData/sensorZenithAngle
#      maxvalue: 45.0
  - filter: Bounds Check
    filter variables:
    - name: brightnessTemperature
      channels: *atms-cld_npp_channels
    minvalue: 100.0
    maxvalue: 500.0
  - filter: GOMsaver
    filename: {{OutDBDir}}/{{geoPrefix}}_atms-cld_npp.nc4
  - filter: YDIAGsaver
    filename: {{OutDBDir}}/{{diagPrefix}}_atms-cld_npp.nc4
    filter variables:
    - name: brightness_temperature_assuming_clear_sky
      channels: *atms-cld_npp_channels

  obs filters:
  - filter: Domain Check
    filter variables:
    - name: brightnessTemperature
      channels: *gmi_gpm_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      minvalue: 1.0
    - variable:
        name: MetaData/latitude
      minvalue: -55.
      maxvalue: 55.

  - filter: Gaussian_Thinning
    horizontal_mesh: 60.0 

  - filter: GOMsaver
    filename: {{OutDBDir}}/{{geoPrefix}}_gmi_gpm.nc4
  - filter: YDIAGsaver
    filename: {{OutDBDir}}/{{diagPrefix}}_gmi_gpm.nc4
    filter variables:
    - name: brightness_temperature_assuming_clear_sky
      channels: *gmi_gpm_channels

  obs filters:
  - filter: Domain Check
    filter variables:
    - name: brightnessTemperature
      channels: *amsr2_gcom-w1_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      minvalue: 1.0
    - variable:
        name: MetaData/latitude
      minvalue: -55.
      maxvalue: 55.
  - filter: Gaussian_Thinning
    horizontal_mesh: 60.0 

  - filter: GOMsaver
    filename: {{OutDBDir}}/{{geoPrefix}}_amsr2_gcom-w1.nc4
  - filter: YDIAGsaver
    filename: {{OutDBDir}}/{{diagPrefix}}_amsr2_gcom-w1.nc4
    filter variables:
    - name: brightness_temperature_assuming_clear_sky
      channels: *amsr2_gcom-w1_channels

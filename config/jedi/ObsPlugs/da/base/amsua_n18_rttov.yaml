- obs space:
    <<: *ObsSpace
    name: amsua_n18_rttov
    _obsdatain: &ObsDataIn
      engine:
        type: H5File
        obsfile: {{InDBDir}}/amsua_n18_rttov_obs_{{thisValidDate}}.h5
    _obsdataout: &ObsDataOut
      engine:
        type: H5File
        obsfile: {{OutDBDir}}{{MemberDir}}/{{obsPrefix}}_amsua_n18_rttov{{ObsOutSuffix}}.h5
    obsdatain: *{{ObsDataIn}}
    {{ObsDataOut}}
    simulated variables: [brightnessTemperature]
    channels: &amsua_n18_channels 5-9
  obs error: *ObsErrorDiagonal
  <<: *horizObsLoc
  obs operator:
    name: RTTOVCPP
    CoefPath: /glade/work/liuz/rttov14/rtcoef_rttov14/rttov13pred54L/
    SensorID: noaa_18_amsua_o3
  get values:
    <<: *GetValues

- obs space:
    <<: *ObsSpace
    name: mhs_metop-b
    _obsdatain: &ObsDataIn
      engine:
        type: H5File
        obsfile: {{InDBDir}}/mhs_metop-b_rttov_obs_{{thisValidDate}}.h5
    _obsdataout: &ObsDataOut
      engine:
        type: H5File
        obsfile: {{OutDBDir}}{{MemberDir}}/{{obsPrefix}}_mhs_metop-b{{ObsOutSuffix}}.h5
    obsdatain: *{{ObsDataIn}}
    {{ObsDataOut}}
    simulated variables: [brightnessTemperature]
    channels: &mhs_metop-b_channels 1-5
  obs error: *ObsErrorDiagonal
  <<: *horizObsLoc
  obs operator:
    name: RTTOVCPP
    CoefPath: /glade/work/liuz/rttov14/rtcoef_rttov14/rttov13pred54L/
    SensorID: metop_1_mhs_o3

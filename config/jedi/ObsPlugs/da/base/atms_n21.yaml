- obs space:
    <<: *ObsSpace
    name: atms_n21
    obsdatain: &ObsDataIn
      engine:
        type: H5File
        obsfile: {{InDBDir}}/atms_n21_obs_{{thisValidDate}}.h5
    obsdataout: &ObsDataOut
      engine:
        type: H5File
        obsfile: {{OutDBDir}}{{MemberDir}}/{{obsPrefix}}_atms_n21.h5
    obsdatain: *{{ObsDataIn}}
    {{ObsDataOut}}
    simulated variables: [brightnessTemperature]
    channels: &atms_n21_channels 1-22
  obs error: *ObsErrorDiagonal
  <<: *horizObsLoc
  obs operator:
    <<: *cloudyCRTMObsOperator
    obs options:
      <<: *CRTMObsOptions
      Sensor_ID: atms_n21

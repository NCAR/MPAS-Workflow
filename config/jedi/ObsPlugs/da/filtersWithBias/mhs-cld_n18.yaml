  obs filters:
  #- filter: GOMsaver
  #  filename: {{OutDBDir}}{{MemberDir}}/{{geoPrefix}}_mhs_n18.nc4
  - filter: Gaussian_Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    action:
      name: reduce obs space

  - filter: Domain Check
    filter variables:
    - name: brightnessTemperature
      channels: 5
    where:
    - variable:
        name: MetaData/latitude
      minvalue: -60.0
      maxvalue: 60.0
    <<: *multiIterationFilter

# obs prior filters:
# over non-water:
  - filter: BlackList
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      maxvalue: 0.99
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        channels: *mhs_n18_channels
        options:
          channels: *mhs_n18_channels
          xvar:
            name: ObsFunction/SIRetSymmetricMW
            options:
              siret_ch90: 1
              siret_ch150: 2
              siret_types: [ObsValue, HofX]
              bias_application: ObsValue
          x0:    [0.05,   0.02,   0.13,   0.13,   0.13 ]
          x1:    [0.13,   0.13,  15.43,  15.43,  14.83 ]
          err0: [500.,  500.,  2.63,   2.68,   2.68 ]
          err1: [500.,  500., 14.03,  20.11,  23.13 ]

# over water
  - filter: BlackList
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      minvalue: 1.0
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelQuad
        channels: *mhs_n18_channels
        options:
          channels: *mhs_n18_channels
          xvar:
            name: ObsFunction/SIRetSymmetricMW
            options:
              siret_ch90: 1
              siret_ch150: 2
              siret_types: [ObsValue, HofX]
              bias_application: ObsValue
          a:    [0.05,   0.02,   0.01,   0.02,   0.02 ]
          b:    [0.13,   0.13,   0.08,   0.08,   0.08 ]
          err0: [500.,   500.,   2.80,   2.14,   1.61 ]
          err1: [500.,   500.,  15.29,  24.83,  33.10 ]

#  Topography check
  - filter: BlackList
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    action:
      name: inflate error
      inflation variable:
        name: ObsFunction/ObsErrorFactorTopoRad
        channels: *mhs_n18_channels
        options:
          sensor: mhs_n18
          channels: *mhs_n18_channels
    <<: *multiIterationFilter
#  Transmittnace Top Check
  - filter: BlackList
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    action:
      name: inflate error
      inflation variable:
        name: ObsFunction/ObsErrorFactorTransmitTopRad
        channels: *mhs_n18_channels
        options:
          channels: *mhs_n18_channels
    <<: *multiIterationFilter

#  Gross check for non-water
  - filter: Background Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      maxvalue: 0.99
    function absolute threshold:
    - name: ObsFunction/ObsErrorBoundMW
      channels: *mhs_n18_channels
      options:
        sensor: mhs_n18
        channels: *mhs_n18_channels
        threshold: 3.0
        obserr_bound_latitude:
          name: ObsFunction/ObsErrorFactorLatRad
          options:
            latitude_parameters: [0.0, 1.0, 0.0, 1.0]
        obserr_bound_transmittop:
          name: ObsFunction/ObsErrorFactorTransmitTopRad
          channels: *mhs_n18_channels
          options:
            channels: *mhs_n18_channels
        obserr_bound_topo:
          name: ObsFunction/ObsErrorFactorTopoRad
          channels: *mhs_n18_channels
          options:
            channels: *mhs_n18_channels
            sensor: mhs_n18
        obserr_function:
          name: ObsFunction/ObsErrorModelRamp
          channels: *mhs_n18_channels
          options:
            channels: *mhs_n18_channels
            xvar:
              name: ObsFunction/SIRetSymmetricMW
              options:
                siret_ch90: 1
                siret_ch150: 2
                siret_types: [ObsValue, HofX]
                bias_application: HofX
            x0:   [0.05,   0.02,   0.13,   0.13,   0.13 ]
            x1:   [0.13,   0.13,  15.43,  15.43,  14.83 ]
            err0: [500.,   500.,   2.63,   2.68,   2.68 ]
            err1: [500.,   500., 14.03,  20.11,  23.13 ]
        obserr_bound_max: [5.0, 5.0, 10.0, 10.0, 10.0]
    action:
      name: reject
    <<: *multiIterationFilter
#  Gross check for water
  - filter: Background Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      minvalue: 1.0
    function absolute threshold:
    - name: ObsFunction/ObsErrorBoundMW
      channels: *mhs_n18_channels
      options:
        sensor: mhs_n18
        channels: *mhs_n18_channels
        threshold: 3.0
        obserr_bound_latitude:
          name: ObsFunction/ObsErrorFactorLatRad
          options:
            latitude_parameters: [0.0, 1.0, 0.0, 1.0]
        obserr_bound_transmittop:
          name: ObsFunction/ObsErrorFactorTransmitTopRad
          channels: *mhs_n18_channels
          options:
            channels: *mhs_n18_channels
        obserr_bound_topo:
          name: ObsFunction/ObsErrorFactorTopoRad
          channels: *mhs_n18_channels
          options:
            channels: *mhs_n18_channels
            sensor: mhs_n18
        obserr_function:
          name: ObsFunction/ObsErrorModelQuad
          channels: *mhs_n18_channels
          options:
            channels: *mhs_n18_channels
            xvar:
              name: ObsFunction/SIRetSymmetricMW
              options:
                siret_ch90: 1
                siret_ch150: 2
                siret_types: [ObsValue, HofX]
                bias_application: HofX
            a:    [0.05,   0.02,   0.01,   0.02,   0.02 ]
            b:    [0.13,   0.13,   0.08,   0.08,   0.08 ]
            err0: [500.,   500.,   2.80,   2.14,   1.61 ]
            err1: [500.,   500.,  15.29,  24.83,  33.10 ]
        obserr_bound_max: [5.0, 5.0, 10.0, 10.0, 10.0]
    action:
      name: reject
    <<: *multiIterationFilter

#  Useflag check
  - filter: Bounds Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n18_channels
    test variables:
    - name: ObsFunction/ChannelUseflagCheckRad
      channels: *mhs_n18_channels
      options:
        channels: *mhs_n18_channels
        use_flag: [ -1, -1, 1, 1, 1]
    minvalue: 1.0e-12
    action:
      name: reject


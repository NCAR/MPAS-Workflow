    <<: *multiIterationFilter

#  Useflag check
  - filter: Bounds Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_metop-b_channels
    test variables:
    - name: ObsFunction/ChannelUseflagCheckRad
      channels: *mhs_metop-b_channels
      options:
        channels: *mhs_metop-b_channels
        use_flag: [ -1, -1, 1, 1, 1]
    minvalue: 1.0e-12
    action:
      name: reject


  obs filters:
  #- filter: GOMsaver
  #  filename: {{OutDBDir}}{{MemberDir}}/{{geoPrefix}}_mhs_n19.nc4
  - filter: Gaussian_Thinning
    horizontal_mesh: {{RADTHINDISTANCE}}
    action:
      name: reduce obs space

  - filter: Domain Check
    filter variables:
    - name: brightnessTemperature
      channels: 5
    where:
    - variable:
        name: MetaData/latitude
      minvalue: -60.0
      maxvalue: 60.0
    <<: *multiIterationFilter

# obs prior filters:
# over non-water:
  - filter: BlackList
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n19_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      maxvalue: 0.99
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelRamp
        channels: *mhs_n19_channels
        options:
          channels: *mhs_n19_channels
          xvar:
            name: ObsFunction/SIRetSymmetricMW
            options:
              siret_ch90: 1
              siret_ch150: 2
              siret_types: [ObsValue, HofX]
              bias_application: ObsValue
          x0:    [0.05,   0.02,  -0.08,  -0.08,  -0.08 ]
          x1:    [0.13,   0.13,  16.42,  16.42,  15.82 ]
          err0: [500.,   500.,   4.36,   2.67,   2.70 ]
          err1: [500.,   500., 16.73,  23.08,  26.35 ]

# over water
  - filter: BlackList
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n19_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      minvalue: 1.0
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelQuad
        channels: *mhs_n19_channels
        options:
          channels: *mhs_n19_channels
          xvar:
            name: ObsFunction/SIRetSymmetricMW
            options:
              siret_ch90: 1
              siret_ch150: 2
              siret_types: [ObsValue, HofX]
              bias_application: ObsValue
          a:    [0.05,   0.02,   0.01,   0.02,   0.02 ]
          b:    [0.13,   0.13,   0.01,   0.08,   0.01 ]
          err0: [500.,   500.,   4.39,   2.07,   1.53 ]
          err1: [500.,   500.,  15.42,  24.69,  32.42 ]

#  Topography check
  - filter: BlackList
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n19_channels
    action:
      name: inflate error
      inflation variable:
        name: ObsFunction/ObsErrorFactorTopoRad
        channels: *mhs_n19_channels
        options:
          sensor: mhs_n19
          channels: *mhs_n19_channels
    <<: *multiIterationFilter
#  Transmittnace Top Check
  - filter: BlackList
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n19_channels
    action:
      name: inflate error
      inflation variable:
        name: ObsFunction/ObsErrorFactorTransmitTopRad
        channels: *mhs_n19_channels
        options:
          channels: *mhs_n19_channels
    <<: *multiIterationFilter

#  Gross check for non-water
  - filter: Background Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n19_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      maxvalue: 0.99
    function absolute threshold:
    - name: ObsFunction/ObsErrorBoundMW
      channels: *mhs_n19_channels
      options:
        sensor: mhs_n19
        channels: *mhs_n19_channels
        threshold: 3.0
        obserr_bound_latitude:
          name: ObsFunction/ObsErrorFactorLatRad
          options:
            latitude_parameters: [0.0, 1.0, 0.0, 1.0]
        obserr_bound_transmittop:
          name: ObsFunction/ObsErrorFactorTransmitTopRad
          channels: *mhs_n19_channels
          options:
            channels: *mhs_n19_channels
        obserr_bound_topo:
          name: ObsFunction/ObsErrorFactorTopoRad
          channels: *mhs_n19_channels
          options:
            channels: *mhs_n19_channels
            sensor: mhs_n19
        obserr_function:
          name: ObsFunction/ObsErrorModelRamp
          channels: *mhs_n19_channels
          options:
            channels: *mhs_n19_channels
            xvar:
              name: ObsFunction/SIRetSymmetricMW
              options:
                siret_ch90: 1
                siret_ch150: 2
                siret_types: [ObsValue, HofX]
                bias_application: HofX
            x0:    [0.05,   0.02,  -0.08,  -0.08,  -0.08 ]
            x1:    [0.13,   0.13,  16.42,  16.42,  15.82 ]
            err0: [500.,   500.,   4.36,   2.67,   2.70 ]
            err1: [500.,   500., 16.73,  23.08,  26.35 ]
        obserr_bound_max: [5.0, 5.0, 7.0, 10.0, 10.0]
    action:
      name: reject
    <<: *multiIterationFilter

#  Gross check for water
  - filter: Background Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n19_channels
    where:
    - variable:
        name: GeoVaLs/water_area_fraction
      minvalue: 1.0
    function absolute threshold:
    - name: ObsFunction/ObsErrorBoundMW
      channels: *mhs_n19_channels
      options:
        sensor: mhs_n19
        channels: *mhs_n19_channels
        threshold: 3.0
        obserr_bound_latitude:
          name: ObsFunction/ObsErrorFactorLatRad
          options:
            latitude_parameters: [0.0, 1.0, 0.0, 1.0]
        obserr_bound_transmittop:
          name: ObsFunction/ObsErrorFactorTransmitTopRad
          channels: *mhs_n19_channels
          options:
            channels: *mhs_n19_channels
        obserr_bound_topo:
          name: ObsFunction/ObsErrorFactorTopoRad
          channels: *mhs_n19_channels
          options:
            channels: *mhs_n19_channels
            sensor: mhs_n19
        obserr_function:
          name: ObsFunction/ObsErrorModelQuad
          channels: *mhs_n19_channels
          options:
            channels: *mhs_n19_channels
            xvar:
              name: ObsFunction/SIRetSymmetricMW
              options:
                siret_ch90: 1
                siret_ch150: 2
                siret_types: [ObsValue, HofX]
                bias_application: HofX
            a:    [0.05,   0.02,   0.01,   0.02,   0.02 ]
            b:    [0.13,   0.13,   0.01,   0.08,   0.01 ]
            err0: [500.,   500.,   4.39,   2.07,   1.53 ]
            err1: [500.,   500.,  15.42,  24.69,  32.42 ]
        obserr_bound_max: [5.0, 5.0, 7.0, 10.0, 10.0]
    action:
      name: reject
    <<: *multiIterationFilter

#  Useflag check
  - filter: Bounds Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_n19_channels
    test variables:
    - name: ObsFunction/ChannelUseflagCheckRad
      channels: *mhs_n19_channels
      options:
        channels: *mhs_n19_channels
        use_flag: [ -1, -1, -1, 1,  1]
    minvalue: 1.0e-12
    action:
      name: reject


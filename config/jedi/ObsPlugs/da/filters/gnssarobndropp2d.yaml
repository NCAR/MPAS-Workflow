  obs filters:
  - filter: Domain Check
    where:
    - variable:
        name: MetaData/impactHeightRO
      minvalue: 0.0
      maxvalue: 16000.0
    - variable:
        name: MetaData/earthRadiusCurvature
      minvalue: 6250000.0
      maxvalue: 6450000.0
    - variable:
        name: MetaData/geoidUndulation
      minvalue: -200.0
      maxvalue: 200.0

  ## Scale ObsError based on ObsValue (based on GNSSRO spaceborne)
  # NMid
  - filter: Perform Action
    filter variables:
    - name: bendingAngle
    where:
    - variable:
        name: MetaData/latitude
      minvalue: *minNMid
      maxvalue: *maxNMid
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelStepwiseLinear
        options:
          xvar:
            name: MetaData/impactHeightRO
          scale_factor_var:
            name: ObsValue/bendingAngle
          xvals: *gnssroErrorLevels
          errors: *gnssrobndropp1dNMidErrors
  # Tro
  - filter: Perform Action
    filter variables:
    - name: bendingAngle
    where:
    - variable:
        name: MetaData/latitude
      minvalue: *minTro
      maxvalue: *maxTro
    action:
      name: assign error
      error function:
        name: ObsFunction/ObsErrorModelStepwiseLinear
        options:
          xvar:
            name: MetaData/impactHeightRO
          scale_factor_var:
            name: ObsValue/bendingAngle
          xvals: *gnssroErrorLevels
          errors: *gnssrobndropp1dTroErrors

  - filter: Background Check
    threshold: 3.0
    <<: *multiIterationFilter

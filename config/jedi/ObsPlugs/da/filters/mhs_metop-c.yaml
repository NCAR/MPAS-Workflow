  obs filters:
  - filter: PreQC
    maxvalue: 0
#  - filter: GOMsaver
#    filename: {{OutDBDir}}{{MemberDir}}/{{geoPrefix}}_mhs_metop-c.nc4
  - filter: Background Check
    threshold: 3.0
    <<: *multiIterationFilter
#  Useflag check
  - filter: Bounds Check
    filter variables:
    - name: brightnessTemperature
      channels: *mhs_metop-c_channels
    test variables:
    - name: ObsFunction/ChannelUseflagCheckRad
      channels: *mhs_metop-c_channels
      options:
        channels: *mhs_metop-c_channels
        use_flag: [ -1, -1, 1, 1,  1]
    minvalue: 1.0e-12
    action:
      name: reject

      GFS:
        30km:
          #directory: /glade/campaign/mmm/parc/liuz/pandac_common/30km/30km_1stCycle_background_single/{{FirstCycleDate}}
          directory: /glade/derecho/scratch/zhuming/pandac/mpas_fcst_30km_L66/{{FirstCycleDate}}

externalanalyses:
  resource: "GFS.NCEPFTP"
  #resource: "GFS.PANDAC"
  #resources:
  #  GFS:
  #    PANDAC: 
  #      30km:
  #        #directory: /glade/derecho/scratch/zhuming/pandac/zhuming_3dVar_OIE30km_Realtime/ExternalAnalyses/30km
  #        directory: /glade/derecho/scratch/zhuming/pandac/mpas_init_30km_L66

observations:
  resource: NCEPFTPOnline
  convertToIODAObservations:
  - 1bamua
  - 1bmhs
  - airsev
  - gpsro
  - prepbufr
  - satwnd
  #- mtiasi
  #- cris

  #CRTMTABLES: /glade/work/nystrom/Code/JEDI/jcsda_internal/CRTM_V3_coeffs/
  CRTMTABLES: /glade/work/zhuming/pandac/crtm/CRTM_V3_coeffs/
  fixedCoeff: /glade/campaign/mmm/parc/jban/pandac_common/obs/satbias
  fixedTlapmeanCov: /glade/campaign/mmm/parc/jban/pandac_common/obs/satbias/2023
  initialVARBCcoeff: /glade/campaign/mmm/parc/jban/pandac_common/obs/satbias/2023

forecast:
  job:
    30km:
      nodes: 2
      PEPerNode: 128
      baseSeconds: 60
      secondsPerForecastHR: 240
  #execute: False # the default is True
  post: [] # use this when doing extended forecast
  #post: [verifymodel] # this turns off verifyobs

#extendedforecast:
#  meanTimes: T00 # T00, T12
#  lengthHR: 120
#  outIntervalHR: 24
#  execute: True # this is the default setting
#  post: [verifymodel,verifyobs] # can be replaced by [verifyobs,verifymodel]

variational:
  DAType: 3denvar
  biasCorrection: True
  nInnerIterations: [60,60,]
  observers: [
    aircraft,
    #gnssrorefncep,
    gnssrobndropp1d,
    satwind,
    satwnd,
    sfc,
    sondes,
    ##amsua_aqua,
    #amsua_metop-a,
    amsua_metop-b,
    amsua_metop-c,
    amsua_n15,
    amsua_n18,
    amsua_n19,
    #amsua-cld_metop-a,
    #amsua-cld_metop-b,
    #amsua-cld_n15,
    #amsua-cld_n18,
    #amsua-cld_n19,
    #mhs_metop-b,
    #mhs_metop-c,
    #mhs_n18,
    #mhs_n19,
    #iasi_metop-b,
    #iasi_metop-c,
  ]
  ensemble:
    forecasts:
      resource: "PANDAC.GEFS"
      PANDAC: # only available 20180415T00-20180514T18
        GEFS:
          30km:
            maxMembers: 30
            #directory0: '/glade/campaign/mmm/parc/zhuming/GenerateGEFS/ExternalAnalyses/30kmGEFS/{{prevDateTime}}'
            directory0: '/glade/derecho/scratch/zhuming/pandac/gefs30km_ensFc/{{prevDateTime}}'
            filePrefix: x1.655362.init
            memberNDigits: 2
    localization:
      30km:
        bumpLocPrefix: bumploc_1200.0km_6.0km
        bumpLocDir: /glade/derecho/scratch/bjung/testdata_prepare.2023gefs/Bflow.20241025/global30km_Bloc
  covariance:
    bumpCovControlVariables:
    - stream_function
    - velocity_potential
    - temperature
    - spechum
    - surface_pressure
    - qc
    - qi
    - qg
    - qr
    - qs
    bumpCovPrefix: mpas
    bumpCovVBalPrefix: mpas
    30km:
      #bumpCovDir: /glade/derecho/scratch/bjung/testdata_prepare.2023gefs/Bflow.20241025/global30km_ENS/NICAS.split/differentPE
      #bumpCovVBalDir: /glade/derecho/scratch/bjung/testdata_prepare.2023gefs/Bflow.20241025/global30km_ENS/VBAL_iterative/differentPE
      bumpCovDir: /glade/derecho/scratch/bjung/testdata_prepare.2023gefs/Bflow.20241025/global30km_ENS/NICAS.split/merge_w_hydro
      bumpCovVBalDir: /glade/derecho/scratch/bjung/testdata_prepare.2023gefs/Bflow.20241025/global30km_ENS/VBAL_iterative/2023070106-2023071100
      bumpCovStdDevFile: /glade/derecho/scratch/bjung/testdata_prepare.2023gefs/Bflow.20241025/global30km_ENS/HDIAG_VAR/merge_w_hydro/mpas.stddev.nc
  # resource requirements
  job:
    30km:
      30km:
        3dvar:
          nodes: 4
          PEPerNode: 64
          memory: 235GB
          baseSeconds: 900
  #execute: False # the default is True
  post: [] # this turns off verifyobs

workflow:
  #first cycle point: 20241130T12
  #first cycle point: 20250106T12
  first cycle point: 20250202T18
  restart cycle point: 20250204T18
  final cycle point: 20250205T00

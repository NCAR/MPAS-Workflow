# settings borrowed from /glade/work/liuz/pandac_hybrid/amsua_clrsky
experiment:
  #suffix: '_ensB-SE80+RTPP70_VarBC'
  name: '3dhybrid_60-60-iter_O30kmI60km_ensB-SE80+RTPP70_VarBC_AMSUA_ALLSKY'

firstbackground:
  resource: "PANDAC.GFS"

forecast:
  #execute: False # the default is True
  #post: [] # use this when doing extended forecast
  post: [verifymodel] # this turns off verifyobs

externalanalyses:
  resource: "GFS.PANDAC"

members:
  n: 1

model:
  outerMesh: 30km
  innerMesh: 60km
  ensembleMesh: 60km

observations:
  resource: PANDACArchiveForVarBC

variational:
  DAType: 3dhybrid
  biasCorrection: True
  nInnerIterations: [60,60,]
  ensemble:
    forecasts:
      resource: "PANDAC.EDA"
  #execute: False # the default is True
  #post: [] # this turns off verifyobs
  observers: [
    aircraft,
    gnssrobndropp1d,
    satwind,
    satwnd,
    sfc,
    sondes,
    amsua_aqua,
    amsua_metop-a,
    amsua_metop-b,
    amsua_n15,
    amsua_n18,
    amsua_n19,
    amsua-cld_metop-a,
    amsua-cld_metop-b,
    amsua-cld_n15,
    amsua-cld_n18,
    amsua-cld_n19,
    mhs_metop-a,
    mhs_metop-b,
    mhs_n18,
    mhs_n19,
]
hofx:
  concatenateObsFeedback: True

workflow:
  first cycle point: 20180414T18
  #restart cycle point: 20180415T00
  final cycle point: 20180415T06
  #final cycle point: 20180514T18
  #CyclingWindowHR: 24 # default is 6 for cycling DA
  #max active cycle points: 4 # used for independent 'extendedforecast'

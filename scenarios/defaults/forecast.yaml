forecast:
  # resource requirements (used for both Forecast and ExtendedForecast)
  job:
    defaults:
      nodes: 1 
      PEPerNode: 128
      baseSeconds: 60
      secondsPerForecastHR: 500
      # uncomment the following to run the forecast on a gpu node on derecho
      #GPUPerNode: 4
      # you must also specify the following in your top level scenario
      # build:
      #   forecast directory: <path to gpu build of MPAS-Model> 
      # The forecast directory can either contain 'atmosphere_model'
      # or be a cmake build of mpas-bundle 

      # cylc retry string
      retry: '0*PT30S'

    #{{outerMesh}}:
    #  baseSeconds: int
    #  secondsPerForecastHR: int
    #  nodes: int
    #  PEPerNode: int
    60-3km:
      # faster turnaround
      #nodes:
      #PEPerNode:
      #baseSeconds: 60
      #secondsPerForecastHR: 120
      # more efficient
      nodes: 4
      PEPerNode: 128
      baseSeconds: 60
      secondsPerForecastHR: 340 #240 for calling radiation every 30 minutes
    30km:
      # faster turnaround
      #nodes: 16
      #PEPerNode: 32
      #baseSeconds: 60
      #secondsPerForecastHR: 120
      # more efficient
      nodes: 2
      PEPerNode: 128
      baseSeconds: 60
      #secondsPerForecastHR: 120
      secondsPerForecastHR: 240
    60km:
      # faster turnaround
      #nodes: 4
      #PEPerNode: 36
      #baseSeconds: 60
      #secondsPerForecastHR: 40
      # more efficient
      nodes: 1
      PEPerNode: 128
      baseSeconds: 60
      secondsPerForecastHR: 70
    120km:
      nodes: 1
      PEPerNode: 128
      baseSeconds: 60
      secondsPerForecastHR: 30

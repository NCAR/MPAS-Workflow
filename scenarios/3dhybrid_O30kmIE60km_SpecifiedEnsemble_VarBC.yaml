# settings borrowed from /glade/work/liuz/pandac_hybrid/amsua_clrsky
experiment:
  suffix: '_ensB-SE80+RTPP70_VarBC_v3.0.2_newBenchmark'

firstbackground:
  resource: "PANDAC.GFS"

forecast:
  job:
    30km:
      nodes: 2
      PEPerNode: 128
      baseSeconds: 60
      secondsPerForecastHR: 240

  #execute: False # the default is True
  #post: [] # use this when doing extended forecast
  post: [verifymodel, verifyobs] # this turns off verifyobs

externalanalyses:
  resource: "GFS.PANDAC"

members:
  n: 1

model:
  outerMesh: 30km
  innerMesh: 60km
  ensembleMesh: 60km

observations:
  resource: PANDACArchiveForVarBC

variational:
  DAType: 3dhybrid
  biasCorrection: True
  ensembleCovarianceWeight: 0.75
  staticCovarianceWeight: 0.25
  nInnerIterations: [60,60,]
  ensemble:
    forecasts:
      resource: "PANDAC.EDA"

  # resource requirements
  job:
    30km:
      60km:
        3dhybrid:
          nodes: 2
          PEPerNode: 128
          memory: 235GB
          baseSeconds: 800
          secondsPerEnVarMember: 9

  #execute: False # the default is True
  #post: [] # this turns off verifyobs

workflow:
  first cycle point: 20180414T18
  #restart cycle point: 20180415T00
  #final cycle point: 20180415T06
  final cycle point: 20180514T18
  #CyclingWindowHR: 24 # default is 6 for cycling DA
  max active cycle points: 20 # used for independent 'extendedforecast'

  retainObsFeedback: True
  concatenateObsFeedback: True
  # coupling to var DA (bias correction, recentering)
  coupledToVarDA: True
  workflowNameVarDA: 'stoedtli_3dhybrid_coupled_test_3'
  recenterAnalyses: False  # not implemented yet
  biasCorrection: True

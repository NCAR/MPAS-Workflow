experiment:
  name: '4_4dhyb_asrama_asrmhs_atms_iasi'
build:
  mpas bundle: /glade/work/liuz/mpas-bundle-build/mpas_bundle_v3.0.3_internal_patch/build_gnuSP
  #forecast directory: ''
  #bundle compiler used: gnu-openmpi
hpc:
  CriticalAccount: NMMM0043
  CriticalQueue: main
  NonCriticalAccount: NMMM0043
  NonCriticalQueue: main
  priority: economy
  SingleProcAccount: NMMM0043
  SingleProcQueue: casper@casper-pbs
firstbackground:
  resource: "PANDAC.GFS"
externalanalyses:
  resource: "GFS.PANDAC"
forecast:
  FourD: True
  post: [] # use this when doing extended forecast
  job:
    15km:
      nodes: 8
      PEPerNode: 128
      baseSeconds: 800
      secondsPerForecastHR: 240

members:
  n: 1
model:
  outerMesh: 15km
  innerMesh: 30km
  ensembleMesh: 30km
observations:
  resource: PANDACArchiveForVarBC
  fixedCoeff: /glade/derecho/scratch/liuz/pandac_common/satbias
  fixedTlapmeanCov: /glade/derecho/scratch/liuz/pandac_common/satbias/2018
  initialVARBCcoeff: /glade/derecho/scratch/liuz/pandac_common/satbias/2018
variational:
  DAType: 4dhybrid
  biasCorrection: True
  #ensembleCovarianceWeight: 0.75
  #staticCovarianceWeight: 0.25
  hybridBECWeightFromFile: true
  nInnerIterations: [60,60,]
  numProcessors: 3584
  ensemble:
    forecasts:
      resource: "PANDAC.LGETKF"
  covariance:
    bumpCovControlVariables:
    - stream_function
    - velocity_potential
    - temperature
    - spechum
    - surface_pressure
    bumpCovPrefix: mpas
    bumpCovVBalPrefix: mpas
  post: []
  observers: [
    aircraft,
    gnssrobndropp1d,
    satwind,
    satwnd,
    sfc,
    sondes,
    amsua_aqua,
    amsua_metop-a,
    amsua_metop-b,
    amsua_n15,
    amsua_n18,
    amsua_n19,
    amsua-cld_metop-a,
    amsua-cld_metop-b,
    amsua-cld_n15,
    amsua-cld_n18,
    amsua-cld_n19,
    mhs-cld_metop-a,
    mhs-cld_metop-b,
    mhs-cld_n18,
    mhs-cld_n19,
    atms_n20,
    atms_npp,
    iasi_metop-a,
    iasi_metop-b,
  ] 
  job:
    15km:
      30km:
        4dhybrid:
          nodes: 56
          PEPerNode: 64
          memory: 235GB
          baseSeconds: 6400
          secondsPerEnVarMember: 10
workflow:
  first cycle point: 20180414T18
  restart cycle point: 20180418T06
  final cycle point: 20180514T12

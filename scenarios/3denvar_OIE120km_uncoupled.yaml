experiment:
  prefix: "stoedtli_"
  name: '3denvar_120km_uncoupled_'
  suffix: "1"

firstbackground:
  resource: "PANDAC.GFS"

forecast:
  execute: False # the default is True
  post: ['verifymodel'] # use this when doing extended forecast

externalanalyses:
  resource: "GFS.PANDAC"

members:
  n: 1

model:
  outerMesh: 120km
  innerMesh: 120km
  ensembleMesh: 120km

observations:
  resource: PANDACArchiveForVarBC

variational:
  DAType: 3denvar
  biasCorrection: True
  nInnerIterations: [60,60,]
  ensemble:
    forecasts:
      resource: "PANDAC.GETKF_uncoupled"
  execute: False # the default is True
  post: [] # this turns off verifyobs
  coupledToEnKF: False

workflow:
  first cycle point: 20180414T18
  #restart cycle point: 20180415T00
  final cycle point: 20180422T00
  #CyclingWindowHR: 24 # default is 6 for cycling DA
  #max active cycle points: 4 # used for independent 'extendedforecast'

build:
  mpas bundle: /glade/work/stoedtli/src/recenter_multires/mpas-bundle/build

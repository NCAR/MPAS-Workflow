experiment:
  name: '4_3dhyb_asr-ama_asr-mhs_atms_iasi'
build:
  mpas bundle: /glade/work/liuz/mpas-bundle-build/mpas_bundle_v3.0.3_internal_patch/build_gnuSP
  #forecast directory: ''
  #bundle compiler used: gnu-openmpi
hpc:
  CriticalAccount: UMMM0012
  CriticalQueue: main
  NonCriticalAccount: UMMM0012
  NonCriticalQueue: main
  priority: premium
  SingleProcAccount: UMMM0012
  SingleProcQueue: casper@casper-pbs
firstbackground:
  resource: "PANDAC.GFS"
externalanalyses:
  resource: "GFS.PANDAC"
forecast:
  post: [] # use this when doing extended forecast
  job:
    15km:
      nodes: 8
      PEPerNode: 128
      baseSeconds: 600
      secondsPerForecastHR: 240

members:
  n: 1
model:
  outerMesh: 15km
  innerMesh: 30km
  ensembleMesh: 30km
observations:
  resource: PANDACArchiveForVarBC
  CRTMTABLES: /glade/campaign/mmm/parc/liuz/pandac_common/crtm_coeffs_v2.4.1/  
  fixedCoeff: /glade/campaign/mmm/parc/liuz/pandac_common/satbias
  fixedTlapmeanCov: /glade/campaign/mmm/parc/liuz/pandac_common/satbias/2018
  initialVARBCcoeff: /glade/campaign/mmm/parc/liuz/pandac_common/satbias/2018
variational:
  DAType: 3dhybrid_v3
  biasCorrection: True
  hybridBECWeightFromFile: true 
  nInnerIterations: [60,60,]
  numProcessors: 512
  ensemble:
    forecasts:
      resource: "PANDAC.LGETKF"
  covariance:
    bumpCovControlVariables:
    - stream_function
    - velocity_potential
    - temperature
    - spechum
    - surface_pressure
    bumpCovPrefix: mpas
    bumpCovVBalPrefix: mpas
    30km:
      bumpCovDir: /glade/u/home/taosun/scratch/pandac/BUMP_STATIC/30km/BUMP_NICAS_NEW
      bumpCovStdDevFile: /glade/u/home/taosun/scratch/pandac/BUMP_STATIC/30km/BUMP_HDIAG_NEW/mpas.stddev.nc
      bumpCovVBalDir: /glade/u/home/taosun/scratch/pandac/BUMP_STATIC/30km/BUMP_VBAL_NEW
  post: []
  observers: [
    aircraft,
    gnssrobndropp1d,
    satwind,
    satwnd,
    sfc,
    sondes,
    #amsua_aqua,
    amsua-all_metop-a,
    amsua-all_metop-b,
    amsua-all_n15,
    amsua-all_n18,
    amsua-all_n19,
    mhs-cld_metop-a,
    mhs-cld_metop-b,
    mhs-cld_n18,
    mhs-cld_n19,
    atms_n20,
    atms_npp,
    iasi_metop-a,
    iasi_metop-b,
  ]
  job:
    15km:
      30km:
        3dhybrid_v3:
          nodes: 8
          PEPerNode: 64
          memory: 235GB
          baseSeconds: 4200
          secondsPerEnVarMember: 10
workflow:
  first cycle point: 20180414T18
  final cycle point: 20180415T00

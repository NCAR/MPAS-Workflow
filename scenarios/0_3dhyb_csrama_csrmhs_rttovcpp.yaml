  initialVARBCcoeff: /glade/derecho/scratch/liuz/pandac_common/satbias/2018
variational:
  DAType: 3dhybrid_v3
  biasCorrection: True
  hybridBECWeightFromFile: false
  nInnerIterations: [60,60,]
  numProcessors: 512
  ensemble:
    forecasts:
      resource: "PANDAC.LGETKF"
  covariance:
    bumpCovControlVariables:
    - stream_function
    - velocity_potential
    - temperature
    - spechum
    - surface_pressure
    bumpCovPrefix: mpas
    bumpCovVBalPrefix: mpas
  post: []
  observers: [
    aircraft,
    gnssrobndropp1d,
    satwind,
    satwnd,
    sfc,
    sondes,
    amsua_aqua_rttov,
    amsua_metop-a_rttov,
    amsua_metop-b_rttov,
    amsua_n15_rttov,
    amsua_n18_rttov,
    amsua_n19_rttov,
    mhs_metop-a_rttov,
    mhs_metop-b_rttov,
    mhs_n18_rttov,
    mhs_n19_rttov,
  ]
  job:
    15km:
      30km:
        3dhybrid_v3:
          nodes: 8
          PEPerNode: 64
          memory: 235GB
          baseSeconds: 3000
          secondsPerEnVarMember: 10 

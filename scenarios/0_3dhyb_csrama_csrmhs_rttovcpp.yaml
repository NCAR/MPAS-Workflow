  #mpas bundle: /glade/work/liuz/mpas-bundle-build/mpas_bundle_v3.0.3_internal_patch/build_gnuSP
  #forecast directory: ''
  #bundle compiler used: gnu-openmpi
hpc:
  CriticalAccount: NMMM0015
  CriticalQueue: main
  NonCriticalAccount: NMMM0015
  NonCriticalQueue: main
  priority: premium
  SingleProcAccount: NMMM0015
  SingleProcQueue: casper@casper-pbs
firstbackground:
  resource: "PANDAC.GFS"
externalanalyses:
  resource: "GFS.PANDAC"
forecast:
  post: [] # use this when doing extended forecast
  job:
    15km:
      nodes: 8
      PEPerNode: 128
      baseSeconds: 600
      secondsPerForecastHR: 100

members:
  n: 1
model:
  outerMesh: 15km
  innerMesh: 30km
  ensembleMesh: 30km
observations:
  resource: PANDACArchiveForVarBC
  CRTMTABLES: /glade/derecho/scratch/liuz/pandac_common/crtm_coeffs_v2.4.1/

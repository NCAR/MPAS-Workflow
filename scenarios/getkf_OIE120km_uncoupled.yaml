experiment:
  prefix: 'stoedtli_'
  name: 'getkf_120km_20mem_uncoupled_'
  suffix: '1'

enkf:
  solver: GETKF
  # localization
  horizontal localization lengthscale: 1.2e6
  vertical localization lengthscale: 6000.0
  vertical localization lengthscale units: height
  fraction of retained variance: 0.95
  # inflation
  rtpp value: 0.5
  rtps value: 0.9
  # ensemble observation equivalent (background, analysis)
  retainObsFeedback: True
  concatenateObsFeedback: False
  # coupling to var DA (bias correction, recentering)
  coupledToVarDA: False
  #workflowNameVarDA: 'stoedtli_3dhybrid_coupled_test_3'
  #recenterAnalyses: False  # not implemented yet
  biasCorrection: True
  staticVarBcDir: /glade/campaign/mmm/parc/jban/pandac/year7Exp/jban_3dhybrid-60-60-iter_O30kmI60km_mhsRaw_clrsky/CyclingDA
  post: []

externalanalyses:
  resource: "GFS.PANDAC"

firstbackground:
  resource: "PANDAC.EnsPertB"

forecast:
  post: []

members:
  n: 20

model:
  outerMesh: 120km
  # TODO: make inner and ensemble meshes unnecessary
  # related to {{PrepareExternalAnalysisInner}} and {{PrepareExternalAnalysisEnsemble}}
  innerMesh: 120km
  ensembleMesh: 120km

observations:
  resource: PANDACArchiveForVarBC

workflow:
  first cycle point: 20180414T18
  #restart cycle point: 20180415T06
  final cycle point: 20180422T00

build:
  mpas bundle: /glade/derecho/scratch/stoedtli/recenter_multires/mpas-bundle/build

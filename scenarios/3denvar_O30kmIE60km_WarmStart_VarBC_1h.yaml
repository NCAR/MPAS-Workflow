
observations:
  resource: "SimonsArchive_1h"

experiment:
  suffix: '_1h_test_1'

members:
  n: 1

model:
  outerMesh: 30km
  innerMesh: 60km
  ensembleMesh: 60km

firstbackground:
  resource: "PANDAC.GFS"
  resources:
    PANDAC:
      GFS:
        60km:
          directory: "/glade/u/home/stoedtli/scratch/1h_cycling/first_background/60km/{{FirstCycleDate}}"
        30km:
          directory: "/glade/u/home/stoedtli/scratch/1h_cycling/first_background/30km/{{FirstCycleDate}}"

externalanalyses:
  resource: "GFS.PANDAC"
  resources:
    GFS:
      PANDAC:
        60km:
          directory: "/glade/u/home/stoedtli/scratch/1h_cycling/external_analyses/60km"
        30km:
          directory: "/glade/u/home/stoedtli/scratch/1h_cycling/external_analyses/30km"

variational:

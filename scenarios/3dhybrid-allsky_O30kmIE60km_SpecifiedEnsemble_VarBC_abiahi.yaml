# settings borrowed from /glade/work/liuz/pandac_hybrid/amsua_clrsky
experiment:
  suffix: '_ensB-SE80+RTPP70_VarBC_WV_CSR_crossCorr'
  #_varBC-BT-SCI-RZA-BTclr 
build:
  mpas bundle: /glade/campaign/mmm/parc/ivette/pandac/codeBuild/mpasBundle_11Dec2024_IRvarbc_obsErrors/build_SP_SymmCldImpactIRPred_BTlimObsError_ZenithAnglePred_BTlimPredictor
  #/glade/campaign/mmm/parc/ivette/pandac/codeBuild/mpasBundle_11Dec2024_IRvarbc_obsErrors/build_SP_SymmCldImpactIRPred_BTlimObsError_ZenithAnglePred_BTlimPredictor
  #/glade/campaign/mmm/parc/ivette/pandac/codeBuild/mpasBundle_11Dec2024_IRvarbc_obsErrors/build_SP_varbc
  #/glade/campaign/mmm/parc/ivette/pandac/codeBuild/mpasBundle_11Dec2024_IRvarbc_obsErrors/build_SP

firstbackground:
  resource: "PANDAC.GFS"

initic:
  job:
      retry: '2*PT30S'

verifymodel:
  job:
      retry: '3*PT30S'

verifyobs:
    defaults:
      retry: '3*PT30S'

forecast:
  job:
    defaults:
      retry: '3*PT30S'
  #execute: False # the default is True
  post: [] # use this when doing extended forecast
  #post: [verifymodel,verifyobs] # this turns off verifyobs

externalanalyses:
  resource: "GFS.PANDAC"

members:
  n: 1

model:
  outerMesh: 30km
  innerMesh: 60km
  ensembleMesh: 60km

observations:
  fixedTlapmeanCov: /glade/campaign/mmm/parc/ivette/pandac/SATBIAS_fixed/abiahi_VarBC_7Jan2025_CA-harnish_newCoeff/all
  #/glade/campaign/mmm/parc/ivette/pandac/SATBIAS_fixed/abiahi_VarBC_7Jan2025/all
  #/glade/campaign/mmm/parc/ivette/pandac/SATBIAS_fixed/abiahi_constantBC_19Dec2024/all
  initialVARBCcoeff: /glade/campaign/mmm/parc/ivette/pandac/SATBIAS_fixed/abiahi_VarBC_7Jan2025_CA-harnish_newCoeff/all
  #/glade/campaign/mmm/parc/ivette/pandac/SATBIAS_fixed/abiahi_VarBC_7Jan2025/all
  #/glade/campaign/mmm/parc/ivette/pandac/SATBIAS_fixed/abiahi_constantBC_19Dec2024/all
  resource: PANDACArchiveForVarBC
  resources:
    PANDACArchiveForVarBC:
      instrumentsAllowingBiasCorrection:
      - amsua_aqua
      - amsua_metop-a
      - amsua_metop-b
      - amsua_metop-c
      - amsua_n15
      - amsua_n18
      - amsua_n19
      - mhs_metop-a
      - mhs_metop-b
      - mhs_n18
      - mhs_n19
      #- ahi_himawari8
      #- abi_g16
      - abi-clr_g16
      - ahi-clr_himawari8
      IODADirectory:
        da:
          abi_g16: /glade/campaign/mmm/parc/ivette/pandac/Observations/abi/bj_so_abi/v3_nc_renamed
          ahi_himawari8: /glade/campaign/mmm/parc/liuz/pandac_common/obs/ioda_v3/2018/AHIASR/IODANC_SUPEROB15X15_no-bias-correct
          abi-clr_g16: /glade/campaign/mmm/parc/ivette/pandac/Observations/abi/bj_so_abi/v3_nc_renamed
          ahi-clr_himawari8: /glade/campaign/mmm/parc/liuz/pandac_common/obs/ioda_v3/2018/AHIASR/IODANC_SUPEROB15X15_no-bias-correct
        hofx:
          abi_g16: /glade/campaign/mmm/parc/ivette/pandac/Observations/abi/bj_so_abi/v3_nc_renamed
          ahi_himawari8: /glade/campaign/mmm/parc/liuz/pandac_common/obs/ioda_v3/2018/AHIASR/IODANC_SUPEROB15X15_no-bias-correct
          abi-clr_g16: /glade/campaign/mmm/parc/ivette/pandac/Observations/abi/bj_so_abi/v3_nc_renamed
          ahi-clr_himawari8: /glade/campaign/mmm/parc/liuz/pandac_common/obs/ioda_v3/2018/AHIASR/IODANC_SUPEROB15X15_no-bias-correct
      IODASuperObGrid:
        abi_g16: 15X15
        ahi_himawari8: 15X15

variational:
  DAType: 3dhybrid-allsky
  biasCorrection: True
  nInnerIterations: [50,60,90,]
  radianceThinningDistance: 90.0
  ensemble:
    forecasts:
      resource: "PANDAC.EDA"
  #execute: False # the default is True
  #post: [] # this turns off verifyobs
  observers: [
    aircraft,
    gnssrobndropp1d,
    satwind,
    satwnd,
    sfc,
    sondes,
    amsua_aqua,
    amsua_metop-a,
    amsua_metop-b,
    amsua_n15,
    amsua_n18,
    amsua_n19,
    mhs_metop-a,
    mhs_metop-b,
    mhs_n18,
    mhs_n19,
    #abi_g16,
    #ahi_himawari8,
    abi-clr_g16,
    ahi-clr_himawari8,
  ]
  job:
    defaults:
      retry: '3*PT30S'
    30km:
      60km:
        3dhybrid-allsky:
          nodes: 4
          PEPerNode: 64
          memory: 235GB
          baseSeconds: 1800
          secondsPerEnVarMember: 8
  concatenateObsFeedback: True

hofx:
  concatenateObsFeedback: True

workflow:
  first cycle point: 20180414T18
  restart cycle point: 20180415T06
  #final cycle point: 20180415T00
  final cycle point: 20180430T18
  #CyclingWindowHR: 24 # default is 6 for cycling DA
  max active cycle points: 60 # used for independent 'extendedforecast'

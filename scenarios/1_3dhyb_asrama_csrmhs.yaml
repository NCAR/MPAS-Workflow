experiment:
  name: '1_3dhyb_asrama_csrmhs'
build:
  mpas bundle: /glade/work/liuz/mpas-bundle-build/mpas_bundle_v3.0.3_internal_patch/build_gnuSP
  #forecast directory: ''
  #bundle compiler used: gnu-openmpi
hpc:
  CriticalAccount: NMMM0043
  CriticalQueue: main
  NonCriticalAccount: NMMM0043
  NonCriticalQueue: main
  priority: regular
  SingleProcAccount: NMMM0043
  SingleProcQueue: casper@casper-pbs
firstbackground:
  resource: "PANDAC.GFS"
externalanalyses:
  resource: "GFS.PANDAC"
forecast:
  post: [] # use this when doing extended forecast
  job:
    15km:
      nodes: 8
      PEPerNode: 128
      baseSeconds: 600
      secondsPerForecastHR: 240

members:
  n: 1
model:
  outerMesh: 15km
  innerMesh: 30km
  ensembleMesh: 30km
observations:
  resource: PANDACArchiveForVarBC
  fixedCoeff: /glade/derecho/scratch/liuz/pandac_common/satbias
  fixedTlapmeanCov: /glade/derecho/scratch/liuz/pandac_common/satbias/2018
  initialVARBCcoeff: /glade/derecho/scratch/liuz/pandac_common/satbias/2018
variational:
  DAType: 3dhybrid_v3
  biasCorrection: True
  hybridBECWeightFromFile: true 
  nInnerIterations: [60,60,]
  numProcessors: 512
  ensemble:
    forecasts:
      resource: "PANDAC.LGETKF"
  covariance:
    bumpCovControlVariables:
    - stream_function
    - velocity_potential
    - temperature
    - spechum
    - surface_pressure
    bumpCovPrefix: mpas
    bumpCovVBalPrefix: mpas
  post: []
  observers: [
    aircraft,
    gnssrobndropp1d,
    satwind,
    satwnd,
    sfc,
    sondes,
    amsua_aqua,
    amsua_metop-a,
    amsua_metop-b,
    amsua_n15,
    amsua_n18,
    amsua_n19,
    amsua-cld_metop-a,
    amsua-cld_metop-b,
    amsua-cld_n15,
    amsua-cld_n18,
    amsua-cld_n19,
    mhs_metop-a,
    mhs_metop-b,
    mhs_n18,
    mhs_n19,
  ]
  job:
    15km:
      30km:
        3dhybrid_v3:
          nodes: 8
          PEPerNode: 64
          memory: 235GB
          baseSeconds: 4200
          secondsPerEnVarMember: 10
workflow:
  first cycle point: 20180414T18
  #  restart cycle point: 20180415T06
  final cycle point: 20180415T00
